name: Feature proposal
description: Propose a scoped improvement with a clear player or contributor benefit.
title: "[Proposal]: "
body:
  - type: markdown
    attributes:
      value: |
        Read the roadmap and check existing issues before proposing a larger change. A proposal opens a discussion; it is not a delivery or payment commitment.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe a concrete player or contributor experience.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful change
      description: Describe the behavior and keep the first implementation bounded.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How would a reviewer tell that the change works?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope
      description: Optional. Mention simpler approaches, save compatibility, new dependencies, or required assets.
